title: Corvus Games Studio
tagline: Indie game studio. Makers of Corvus Protocol.
description: >-
  Corvus Games Studio is an independent game studio. We make Corvus Protocol —
  a sci-fi game built with passion and grit. Follow the journey, grab the latest
  release, and join the community.
url: "https://corvusgamesstudio.com"
baseurl: ""

author:
  name: Corvus Games Studio
  email: corvus@corvusgamesstudio.com

# Navigation order shown in the header
nav:
  - title: Home
    url: /
  - title: Corvus Protocol
    url: /corvus-protocol/
  - title: About
    url: /about/
  - title: Support
    url: /support/
  - title: Contact
    url: /contact/

# Edit these to update the footer / home socials section
socials:
  - name: Discord
    url: https://discord.gg/JbSK3W9cj3
    icon: discord
  - name: X
    url: https://x.com/CorvusGame
    icon: x
  - name: Instagram
    url: https://www.instagram.com/corvusgamesstudio/
    icon: instagram
  - name: TikTok
    url: https://www.tiktok.com/@corvusgames
    icon: tiktok
  - name: Threads
    url: https://www.threads.com/@corvusgamesstudio
    icon: threads
  - name: Reddit
    url: https://www.reddit.com/user/CorvusGamesStudio/
    icon: reddit

# Funding pages — surfaced on the Support page
funding:
  - name: Buy Me a Coffee
    url: https://buymeacoffee.com/corvusgames
    blurb: Toss us a one-time tip to fuel the next build.
    cta: Buy us a coffee
  - name: Ko-fi
    url: https://ko-fi.com/corvusgames
    blurb: Become a recurring supporter and unlock Early Access perks.
    cta: Support on Ko-fi

# Studio brand assets
brand:
  logo: /assets/corvus_games_studio/corvuslogosmall.png
  banner: /assets/corvus_games_studio/corvusgames_banner.png

# Game info (used on the Corvus Protocol page + home teaser)
game:
  title: Corvus Protocol
  tagline: A bird-brained tactical roguelite from Corvus Games Studio.
  repo: Corvus-Games-Studio/Corvus-Protocol-Release-Channel
  releases_url: https://github.com/Corvus-Games-Studio/Corvus-Protocol-Release-Channel/releases
  hero_image: /assets/corvus_protocol/CorvusProtocolIcon.png
  banner_image: "/assets/corvus_protocol/2026-04-14 18_30_26-Corvus Protocol1600400.png"

markdown: kramdown
highlighter: rouge
permalink: /:path/

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor/
  - node_modules/
